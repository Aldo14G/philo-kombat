<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Philo Kombat</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-theme="arcade">
    <div id="app">
      <div id="stage-wrap">
        <div id="game-container" aria-label="Philo Kombat game board"></div>
        <header id="hud" class="px-card px-card--compact">
          <div class="hud-side">
            <span id="name1" class="px-display px-display--xs"></span>
            <div class="px-progress hud-hp" role="progressbar" aria-label="Vida del jugador 1">
              <span id="hp1-fill" class="px-progress-fill"></span>
            </div>
            <div id="pips1" class="hud-pips" aria-label="Rondas del jugador 1"></div>
          </div>
          <div id="hud-timer" class="px-display px-display--sm">—</div>
          <div class="hud-side hud-side--right">
            <span id="name2" class="px-display px-display--xs"></span>
            <div class="px-progress hud-hp hud-hp--right" role="progressbar" aria-label="Vida del jugador 2">
              <span id="hp2-fill" class="px-progress-fill"></span>
            </div>
            <div id="pips2" class="hud-pips" aria-label="Rondas del jugador 2"></div>
          </div>
        </header>
        <div id="announcer" class="px-display px-display--lg" aria-live="polite"></div>
      </div>
      <footer id="controls-help">
        <kbd class="px-kbd">A/D</kbd> moverse · <kbd class="px-kbd">W</kbd> salto ·
        <kbd class="px-kbd">S</kbd> agachar · <kbd class="px-kbd">F/G</kbd> puños ·
        <kbd class="px-kbd">H/J</kbd> patadas · <kbd class="px-kbd">T</kbd> especial ·
        atrás = bloqueo — <strong>P2:</strong> flechas + <kbd class="px-kbd">, . /</kbd> ·
        <kbd class="px-kbd">RCtrl</kbd> especial
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
